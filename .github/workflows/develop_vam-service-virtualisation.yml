name: Build and Deploy Spring Boot Backend
 
on:

  push:

    branches:

      - develop
 
  workflow_dispatch:
 
env:

  AZURE_WEBAPP_NAME: vam-service-virtualisation

  JAVA_VERSION: '17'

  SOURCE_JAR: backend/target/service-virtualization-0.0.1-SNAPSHOT.jar

  DEPLOY_JAR: service-virtualization.jar
 
jobs:

  build-and-deploy:
 
    runs-on: ubuntu-latest
 
    steps:
 
      # ---------------------------------------------------------

      # 1. Checkout source code

      # ---------------------------------------------------------

      - name: Checkout repository

        uses: actions/checkout@v4
 
      # ---------------------------------------------------------

      # 2. Setup Java 17

      # ---------------------------------------------------------

      - name: Set up Java 17

        uses: actions/setup-java@v4

        with:

          java-version: ${{ env.JAVA_VERSION }}

          distribution: temurin

          cache: maven
 
      # ---------------------------------------------------------

      # 3. Check Java and Maven

      # ---------------------------------------------------------

      - name: Check Java and Maven versions

        run: |

          java -version

          mvn -version
 
      # ---------------------------------------------------------

      # 4. Build Spring Boot executable JAR

      # ---------------------------------------------------------

      - name: Build Spring Boot application

        working-directory: backend

        run: |

          mvn -B clean package -DskipTests
 
      # ---------------------------------------------------------

      # 5. Verify generated JAR

      # ---------------------------------------------------------

      - name: Verify generated JAR

        run: |

          echo "Checking generated JAR..."
 
          if [ ! -f "${{ env.SOURCE_JAR }}" ]; then

            echo "ERROR: JAR file was not generated."

            echo ""

            echo "Available files under backend/target:"

            find backend/target -maxdepth 1 -type f -print

            exit 1

          fi
 
          echo "JAR found:"

          ls -lh "${{ env.SOURCE_JAR }}"
 
      # ---------------------------------------------------------

      # 6. Verify Spring Boot manifest

      # ---------------------------------------------------------

      - name: Verify Spring Boot manifest

        run: |

          echo "Checking JAR manifest..."
 
          unzip -p "${{ env.SOURCE_JAR }}" META-INF/MANIFEST.MF
 
      # ---------------------------------------------------------

      # 7. Prepare deployment JAR

      # ---------------------------------------------------------

      - name: Prepare deployment JAR

        run: |

          echo "Preparing deployment JAR..."
 
          cp "${{ env.SOURCE_JAR }}" "${{ env.DEPLOY_JAR }}"
 
          echo "Deployment JAR:"

          ls -lh "${{ env.DEPLOY_JAR }}"
 
      # ---------------------------------------------------------

      # 8. Verify deployment JAR

      # ---------------------------------------------------------

      - name: Verify deployment JAR

        run: |

          echo "Verifying deployment package..."
 
          if [ ! -f "${{ env.DEPLOY_JAR }}" ]; then

            echo "ERROR: Deployment JAR does not exist."

            exit 1

          fi
 
          echo "Deployment JAR is ready:"

          ls -lh "${{ env.DEPLOY_JAR }}"
 
      # ---------------------------------------------------------

      # 9. Deploy to Azure Web App

      # ---------------------------------------------------------

      - name: Deploy to Azure Web App

        uses: azure/webapps-deploy@v3

        with:

          app-name: ${{ env.AZURE_WEBAPP_NAME }}

          publish-profile: ${{ secrets.AZURE_CREDENTIALS }}

          package: ${{ env.DEPLOY_JAR }}
 
