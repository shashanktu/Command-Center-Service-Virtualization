name: Build and Deploy Spring Boot Backend

on:
  push:
    branches:
      - develop

  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: vam-service-virtualisation
  JAVA_VERSION: '17'
  JAR_FILE: backend/target/service-virtualization-0.0.1-SNAPSHOT.jar

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Checkout source code
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # 2. Setup Java 17
      # ---------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven


      # ---------------------------------------------------------
      # 3. Check Java and Maven
      # ---------------------------------------------------------
      - name: Check Java and Maven versions
        run: |
          java -version
          mvn -version


      # ---------------------------------------------------------
      # 4. Build Spring Boot executable JAR
      # ---------------------------------------------------------
      - name: Build Spring Boot application
        working-directory: backend
        run: |
          mvn -B clean package -DskipTests


      # ---------------------------------------------------------
      # 5. Verify JAR exists
      # ---------------------------------------------------------
      - name: Verify generated JAR
        run: |
          echo "Checking generated JAR..."

          if [ ! -f "${{ env.JAR_FILE }}" ]; then
            echo "ERROR: JAR file was not generated."
            exit 1
          fi

          echo "JAR found:"
          ls -lh "${{ env.JAR_FILE }}"

          echo ""
          echo "JAR contents:"
          jar tf "${{ env.JAR_FILE }}" | head -30


      # ---------------------------------------------------------
      # 6. Verify Spring Boot executable JAR
      # ---------------------------------------------------------
      - name: Verify Spring Boot manifest
        run: |
          echo "Checking JAR manifest..."

          unzip -p "${{ env.JAR_FILE }}" META-INF/MANIFEST.MF


      # ---------------------------------------------------------
      # 7. Deploy JAR to Azure App Service
      # ---------------------------------------------------------
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_CREDENTIALS }}
          package: ${{ env.JAR_FILE }}
