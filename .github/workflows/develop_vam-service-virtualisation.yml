name: Java CI with Maven

on:
  push:
    branches: ["develop"]

env:
  AZURE_WEBAPP_NAME: vam-service-virtualisation
  PORT: 3001

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build JAR with Maven
        working-directory: backend
        run: mvn -B -DskipTests clean package

      - name: Verify Spring Boot JAR
        run: |
          JAR=$(find backend/target -maxdepth 1 -name "*.jar" -type f | head -n 1)
      
          echo "JAR: $JAR"
      
          echo "Checking Spring Boot structure..."
          jar tf "$JAR" | grep -E "BOOT-INF|org/springframework/boot/loader" | head -20
      
          echo "Checking manifest..."
          unzip -p "$JAR" META-INF/MANIFEST.MF

      - name: List generated files
        run: |
          echo "Contents of backend/target:"
          ls -lah backend/target/

      - name: Prepare deployment package
        run: |
          mkdir deploy
          cp backend/target/*.jar deploy/service-virtualization.jar
          cd deploy
          zip -r ../app.zip .

      - name: Show deployment package
        run: |
          echo "Contents of app.zip:"
          unzip -l app.zip

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: service-virtualization-jar
          path: backend/target/*.jar

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_CREDENTIALS }}
          package: app.zip

      - name: Show deployment package
        run: |
          echo "Contents of app.zip:"
          unzip -l app.zip

      - name: Prepare deployment package
        run: |
            rm -rf deploy
            mkdir deploy
        
            JAR=$(find backend/target -maxdepth 1 -name "*.jar" -type f | head -n 1)
        
            echo "JAR found:"
            echo "$JAR"
        
            ls -lh "$JAR"
        
            cp "$JAR" deploy/service-virtualization.jar
        
            echo "Deployment directory:"
            ls -lah deploy
        
            cd deploy
            zip -r ../app.zip .

      - name: Verify deployment package
        run: |
          echo "=== app.zip ==="
          ls -lh app.zip
      
          echo "=== ZIP contents ==="
          unzip -l app.zip
      
          echo "=== Verify JAR inside ZIP ==="
          unzip -l app.zip | grep service-virtualization.jar
